##
## Rename this file to properties.ini and fill in your values below
##

[GENERAL]
BASE_DOMAIN_NAME=localhost:8000
SECRET_KEY=super_secret
DEBUG=True

### Google Analytics Tracking ID for Authentication/Registration views only
### The actual app should use different tracking IDs for manager,auditor and client UIs
AUTH_GA_ID=UA-XXXXXXXX-X

### IMGIX subdomain source configured to serve attachments
IMGIX_SUBDOMAIN=fw-att-test.imgix.net

[DATABASE]
ENGINE=django.db.backends.postgresql_psycopg2
NAME=db_name
USER=db_user
PASSWORD=db_pass
HOST=db_host
PORT=5432

[EMAIL_SETTINGS]
HOST=smtp.gmail.com
PORT=587
HOST_USER=foo@bar.com
HOST_PASSWORD=password
DEFAULT_FROM_EMAIL=Admin <admin@example.com>
SERVER_EMAIL=Admin <admin@foobar.com>

[PAYMENT_CSV_SETTINGS]
ORDERINGACCNO=2541109900110007
REMITTER_NAME=FLOORWALK CONSULTANTS PVT LTD
SENTTORECVINFO=Floorwalk Audit fees
INDICATOR=EML
ORIGINAL_REMITTER=FLOORWALK CONSULTANTS PVT LTD

[S3_ATTACHMENTS]
AWS_ACCESS_KEY_ID=foobar
AWS_SECRET_ACCESS_KEY=foobar_secret
BUCKET=fw-attachments-test
REGION=ap-southeast-1
MIN_SIZE=1024
### 20 * 1024 * 1024 = 20971520 bytes
MAX_SIZE=20971520
FILE_SLUG_SIZE=10

[LOGGER_SETTINGS]
### set log level to any one of: DEBUG, INFO, WARNING, ERROR, CRITICAL
### set to INFO preferably
LOG_LEVEL=INFO

### set this to the file where django logs are recorded
DJANGO_LOG_FILENAME=/home/foobar/logs/kronos/django.log

### add log handlers, can contain 'logfile' which logs to above file or 'console' or both
### should use only 'logfile' in production and only 'console' in development
LOG_HANDLERS=console,logfile

### add a switch for email sending email notifications
### when set to true, emails will be sent when the action is triggered
[EMAIL_SWITCH]
NOTIFICATION=False
VERIFICATION=False
PRE_REMINDER=False
ON_REMINDER=False
POST_REMINDER=False
WELCOME=False
