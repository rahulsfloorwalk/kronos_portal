# Python CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-python/ for more details
#
version: 2.1

workflows:
  version: 2.1
  test-and-package:
    jobs:
      - pytest
      - jstest
      - jslint
#      - pylint
      - package:
          requires:
            - pytest
            - jstest
            - jslint
#            - pylint
          filters:
            branches:
              only:
                - development
                - master
      - hold-sentry-upload-source:
          type: approval
          requires:
            - package
      - sentry-upload-source:
          requires:
            - hold-sentry-upload-source

commands:
  guard-tagged-commit:
    description: "Returns a non-zero exit code if the current commit is not tagged."
    steps:
      - run:
          name: "Ensuring that the commit is tagged."
          command: "if [[ -z $CIRCLE_TAG ]]; then echo 'Please ensure the commit is tagged.'; $(exit 1); else echo 'Commit is tagged. Good Job'; fi"

  py-restore-cache:
    description: "Restore, Update and Cache python dependencies"
    steps:
      - restore_cache:
          key: v3-dependencies-{{ checksum "requirements.txt" }}

      - run:
          name: install python dependencies
          command: |
            python3 -m venv venv
            . venv/bin/activate
            python -m pip install --trusted-host pypi.python.org -r requirements.txt

      - save_cache:
          paths:
            - ./venv
          key: v3-dependencies-{{ checksum "requirements.txt" }}

  js-restore-cache:
    description: "Restore, Update and Cache javascript dependencies"
    steps:
      - restore_cache:
          key: v3-frontend-dependencies-{{ checksum "frontend/package-lock.json" }}

      - run:
          name: install javascript dependencies
          command: |
            cd frontend
            npm install

      - save_cache:
          paths:
            - ./frontend/node_modules
          key: v3-frontend-dependencies-{{ checksum "frontend/package-lock.json" }}

jobs:
  sentry-upload-source:
    docker:
      - image: circleci/python:3.5.4-node
    environment:
      - SENTRY_ORG: floorwalk
      - SENTRY_PROJECT_NAME: kronos
    steps:
      - checkout
      - js-restore-cache
      - attach_workspace:
          at: frontend/dist
      - run:
          name: create a new sentry release
          command: |
            cd frontend
            ./node_modules/.bin/sentry-cli releases -p $SENTRY_PROJECT_NAME new $(node -p -e "require('./package.json').version")
      - run:
          name: upload source maps for the release
          command: |
            cd frontend
            ./node_modules/.bin/sentry-cli releases -p $SENTRY_PROJECT_NAME files $(node -p -e "require('./package.json').version") upload-sourcemaps --url-prefix="~/static/" --validate `find dist/ -name "*.js.map"`
      - run:
          name: finalize the release
          command: |
            cd frontend
            ./node_modules/.bin/sentry-cli releases -p $SENTRY_PROJECT_NAME finalize $(node -p -e "require('./package.json').version")

  package:
    docker:
      - image: circleci/python:3.5.4-node

    steps:
      - checkout
      - py-restore-cache
      - js-restore-cache

      - run:
          name: generate frontend bundles through webpack
          command: |
            cd frontend
            npm run build-prod

      - run:
          name: package the tar
          command: python setup.py sdist

      - store_artifacts:
          path: dist

      - persist_to_workspace:
          root: .
          paths:
            - ./frontend/dist

  pytest:
    docker:
      # specify the version you desire here
      # use `-browsers` prefix for selenium tests, e.g. `3.6.1-browsers`
      - image: circleci/python:3.5.4-node

      # Specify service dependencies here if necessary
      # CircleCI maintains a library of pre-built images
      # documented at https://circleci.com/docs/2.0/circleci-images/
      - image: circleci/postgres:9.6.16
        environment:
        - POSTGRES_USER=postgres
        - POSTGRES_DB=kronos_db_test
      
    steps:
      - checkout
      - py-restore-cache

      - run:
          name: write test properties
          command: cp .circleci/properties.test.ini properties.ini

      - run:
          name: create test results directory
          command: mkdir test-results

      - run:
          name: run tests and generate reports
          command: |
            . venv/bin/activate
            coverage run -m pytest
            coverage html
            coverage report --fail-under=49

      - store_artifacts:
          path: htmlcov

      - store_artifacts:
          path: /tmp/kronos.log
          
      - store_test_results:
          path: test-results

#  pylint:
#    docker:
#      - image: circleci/python:3.5.4-node
#
#    steps:
#      - checkout
#      - py-restore-cache
#
#      - run:
#          name: run the linter
#          command: |
#            . venv/bin/activate
#            flake8 --config=.flake8rc

  jstest:
    docker:
      - image: circleci/python:3.5.4-node

    steps:
      - checkout
      - js-restore-cache

      - run:
          name: run the jest tests
          command: |
            cd frontend
            npm run jest-coverage-ci

      - store_artifacts:
          path: frontend/coverage

      - store_test_results:
          path: frontend/test_results

  jslint:
    docker:
      - image: circleci/python:3.5.4-node

    steps:
      - checkout
      - js-restore-cache

      - run:
          name: run the linter
          command: |
            cd frontend
            npm run eslint js/**/*.{js,jsx}
