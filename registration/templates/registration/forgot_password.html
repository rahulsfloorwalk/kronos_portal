{% extends "registration/base.html" %}
{% load widget_tweaks %}
{% block content %}
<div class="row">
	<div class="col-md-offset-3 col-md-6">
		<h1 class="page-header">
			<a href="http://floorwalk.in">
				<img class="img-responsive" style="margin-left:auto;margin-right:auto;" src="/static/img/logo_3_500x100.png"/>
			</a>
		</h1>
		<div class="panel panel-primary">
			<div class="panel-heading">
				<h3 class="panel-title">Password Recovery</h3>
			</div>
			<div class="panel-body">
				<form action="{% url 'registration:password_reset' %}" method="POST">
					{% csrf_token %}
					<div class="form-group">
						<label>{{ form.email.label }}</label>
						{{ form.email |add_class:'form-control' | attr:"placeholder:name@example.com"}}
					</div>
					<div class="form-group">
						<button class="btn btn-primary btn-lg" type="submit">Reset</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
{% include "registration/tawk.html" %}
{% endblock %}
