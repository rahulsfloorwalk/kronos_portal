{% load widget_tweaks %}
<!DOCTYPE html>
<html>
	<head>
		<!-- Latest compiled and minified CSS -->
		<link rel="stylesheet" 
			href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" 
			integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
	</head>
	<body class="container">
		<div class="row">
			<div class="col-md-offset-3 col-md-6">
				<h1 class="page-header">Vitric Business Solutions</h1>
				<div class="panel panel-primary">
					<div class="panel-heading">
						<h3 class="panel-title">Password Recovery</h3>
					</div>
					<div class="panel-body">
						<form action="{% url 'registration:forgot_password' %}" method="POST">
							{% csrf_token %}
							<div class="form-group">
								<label for="id_email">Email:</label>
								<input class="form-control input-lg" id="id_email" type="email" name="email" required />
							</div>
							<div class="form-group">
								<button class="btn btn-primary btn-lg" type="submit">Recover</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
